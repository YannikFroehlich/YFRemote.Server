name: Android-SDK einrichten
description: Android-cmdline-tools, platform-tools, platforms;android-34 und build-tools;34.0.0 installieren

# Gemeinsam fuer ci.yml (PR-Build) und release.yml (release-android), damit beide dasselbe SDK
# bekommen und die Workarounds unten nur an einer Stelle gepflegt werden.
#
# Nicht android-actions/setup-android@v3: die Action bricht auf aktuellen Ubuntu-Runnern
# beim sdkmanager-Aufruf mit exit code 1 ab (neue "Android SDK Preview"-Lizenz, die die
# Action nicht automatisch akzeptiert - beobachtet 2026-09-22). Direktes Setup von Googles
# eigenen Command-Line-Tools stattdessen, inkl. expliziter Lizenz-Akzeptanz.
# "(yes || true) | sdkmanager" statt "yes | sdkmanager": sdkmanager schliesst stdin, sobald
# alle Lizenzen abgefragt sind, wodurch "yes" mit SIGPIPE (exit 141) endet - mit "pipefail"
# (Standard fuer bash-Steps) reisst das den ganzen Schritt trotz Erfolg von sdkmanager mit
# in den Fehlschlag (beobachtet 2026-09-22, Run 35779526923).
runs:
  using: composite
  steps:
    - name: Android-SDK einrichten
      shell: bash
      run: |
        set -e
        sdk_root="$HOME/android-sdk"
        mkdir -p "$sdk_root/cmdline-tools"
        # Ohne Retries reisst ein einzelner Netzwerkaussetzer bei Google den ganzen
        # Release-Lauf mit (beobachtet 2026-09-23, Run 35909268526: "curl: (92) HTTP/2
        # stream 1 was not closed cleanly: INTERNAL_ERROR").
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
          -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
        unzip -q cmdline-tools.zip -d "$sdk_root/cmdline-tools"
        mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
        rm cmdline-tools.zip

        echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
        echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
        echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"

        (yes || true) | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
        "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
