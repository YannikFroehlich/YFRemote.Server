<section class="keyboard-card">
  <header class="keyboard-card__header">
    <div>
      <p class="eyebrow">Direkte Eingabe</p>
      <h2>Virtuelle Tastatur</h2>
    </div>
    <span class="keyboard-card__hint">Modifier auswählen, dann Taste senden</span>
  </header>

  <div class="field keyboard-card__body">
    <span class="sr-only">Tastatur</span>
    <div class="key-picker">
      @for (group of keyGroups; track group.label) {
        <div class="key-group">
          <p class="key-group__label">{{ group.label }}</p>
          <div class="key-group__keys">
            @for (key of group.keys; track key) {
              <button
                class="key-chip"
                type="button"
                [class.key-chip--active]="isKeyActive(key)"
                [disabled]="isKeyDisabled(key)"
                [attr.aria-pressed]="isKeyActive(key)"
                (click)="onKeyTap(key)"
              >
                {{ key }}
              </button>
            }
            @if (group.label === 'Modifikatoren') {
              <button
                class="key-chip"
                type="button"
                aria-label="Windows-Taste allein senden (öffnet das Startmenü)"
                (click)="pressKey('WIN')"
              >
                START
              </button>
            }
          </div>
        </div>
      }
    </div>
    <output class="key-picker__summary">{{ summary() }}</output>
  </div>

  <footer class="keyboard-card__footer">
    <button class="secondary-button" type="button" (click)="clearArmed()">Zurücksetzen</button>
  </footer>
</section>
