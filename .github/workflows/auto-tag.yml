name: Auto Tag YFRemote

# Ermittelt bei jedem Push nach main die naechste semantische Version anhand von
# Conventional Commits (fix: -> patch, feat: -> minor, feat!:/BREAKING CHANGE: -> major)
# und stoesst darueber direkt den bestehenden Release-Workflow an. Ein Commit mit
# "[skip release]" in der Merge-Commit-Message ueberspringt das Release. Ueber
# workflow_dispatch laesst sich die Versionsstufe auch manuell erzwingen, z. B. um
# nach einer reinen Client-Aenderung ein neues Release ohne neuen Server-Commit
# auszuloesen.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Versionsstufe erzwingen (z. B. fuer eine reine Client-Aenderung)"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  # Die Sperre bleibt auch aktiv, waehrend der wiederverwendbare Release-Job laeuft.
  group: yfremote-version-release
  cancel-in-progress: false
  queue: max

jobs:
  determine-version:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip release]')
    outputs:
      version: ${{ steps.next.outputs.new_version }}
      client_sha: ${{ steps.client.outputs.sha }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Client-Commit festhalten
        uses: actions/checkout@v6
        with:
          repository: YannikFroehlich/YFRemote.Client
          path: client
          ref: master
          token: ${{ secrets.CLIENT_REPOSITORY_TOKEN || github.token }}

      - name: Client-Commit pruefen
        id: client
        shell: bash
        run: |
          client_sha="$(git -C client rev-parse HEAD)"
          if [[ ! "$client_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Ungueltige Client-SHA: $client_sha" >&2
            exit 1
          fi
          echo "sha=$client_sha" >> "$GITHUB_OUTPUT"

      - name: Naechste Version aus Commits ermitteln
        id: next
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
          release_branches: main
          tag_prefix: v
          dry_run: true

  release:
    needs: determine-version
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.determine-version.outputs.version }}
      client_sha: ${{ needs.determine-version.outputs.client_sha }}
    secrets: inherit
