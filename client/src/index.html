<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>YFRemote</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="brand-mark.png">
  <meta name="theme-color" content="#070b0e" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eef3f4" media="(prefers-color-scheme: light)">
  <script>
    // Gespeicherten Stil und Hell/Dunkel-Modus vor dem ersten Rendern setzen, sonst blitzt der
    // falsche auf. Gleiche Logik wie applyThemeStyle/applyThemeMode in src/app/remote/theme.ts.
    (function () {
      try {
        var style = localStorage.getItem('yfremote.themeStyle');
        if (style === 'futuristic' || style === 'minimal') document.documentElement.dataset.style = style;
        var mode = localStorage.getItem('yfremote.themeMode');
        if (mode !== 'light' && mode !== 'dark') return;
        document.documentElement.dataset.mode = mode;
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
          meta.content = mode === 'light' ? '#eef3f4' : '#070b0e';
        });
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
