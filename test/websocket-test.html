<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YFRemote WebSocket Test</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Segoe UI", system-ui, sans-serif;
      line-height: 1.4;
    }

    body {
      margin: 0;
      padding: 32px;
      background: Canvas;
      color: CanvasText;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 28px;
      font-weight: 650;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input,
    button,
    pre {
      font: inherit;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid color-mix(in srgb, CanvasText 25%, Canvas);
      border-radius: 6px;
      background: Canvas;
      color: CanvasText;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0;
    }

    button {
      min-height: 40px;
      padding: 8px 12px;
      border: 1px solid color-mix(in srgb, CanvasText 25%, Canvas);
      border-radius: 6px;
      background: ButtonFace;
      color: ButtonText;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    section {
      margin-top: 20px;
    }

    pre {
      min-height: 42px;
      margin: 6px 0 0;
      padding: 12px;
      overflow: auto;
      border: 1px solid color-mix(in srgb, CanvasText 18%, Canvas);
      border-radius: 6px;
      background: color-mix(in srgb, CanvasText 5%, Canvas);
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <main>
    <h1>YFRemote WebSocket Test</h1>

    <label for="wsUrl">WebSocket URL</label>
    <input id="wsUrl" autocomplete="off">

    <div class="toolbar">
      <button id="connect">Connect</button>
      <button data-payload='{"type":"hotkey","keys":["CTRL","TAB"]}' disabled>CTRL+TAB</button>
      <button data-payload='{"type":"hotkey","keys":["CTRL","SHIFT","TAB"]}' disabled>CTRL+SHIFT+TAB</button>
      <button data-payload='{"type":"key","keys":["SPACE"]}' disabled>SPACE</button>
      <button data-payload='{"type":"key","keys":["F11"]}' disabled>F11</button>
      <button data-payload='{"type":"key","keys":["ENTER"]}' disabled>ENTER</button>
    </div>

    <div class="toolbar">
      <button data-payload='{"type":"mouseMove","deltaX":-50,"deltaY":0}' disabled>Mouse Left</button>
      <button data-payload='{"type":"mouseMove","deltaX":50,"deltaY":0}' disabled>Mouse Right</button>
      <button data-payload='{"type":"mouseMove","deltaX":0,"deltaY":-50}' disabled>Mouse Up</button>
      <button data-payload='{"type":"mouseMove","deltaX":0,"deltaY":50}' disabled>Mouse Down</button>
      <button data-payload='{"type":"mouseClick","button":"left"}' disabled>Left Click</button>
      <button data-payload='{"type":"mouseClick","button":"right"}' disabled>Right Click</button>
      <button data-payload='{"type":"mouseScroll","delta":120}' disabled>Scroll Up</button>
      <button data-payload='{"type":"mouseScroll","delta":-120}' disabled>Scroll Down</button>
    </div>

    <div class="toolbar">
      <input id="textInput" placeholder="Text eingeben…" autocomplete="off" disabled />
      <button id="sendText" disabled>Send Text</button>
    </div>

    <section>
      <label>Status</label>
      <pre id="status">disconnected</pre>
    </section>

    <section>
      <label>Sent</label>
      <pre id="sent"></pre>
    </section>

    <section>
      <label>Response</label>
      <pre id="response"></pre>
    </section>
  </main>

  <script>
    const urlInput = document.querySelector("#wsUrl");
    const connectButton = document.querySelector("#connect");
    const commandButtons = [...document.querySelectorAll("button[data-payload]")];
    const statusOutput = document.querySelector("#status");
    const sentOutput = document.querySelector("#sent");
    const responseOutput = document.querySelector("#response");
    const textInput = document.querySelector("#textInput");
    const sendTextButton = document.querySelector("#sendText");

    let socket;

    // Muss von der eigenen Origin des Servers stammen (nicht file://), da /ws den
    // Origin-Header prueft. Wird deshalb dynamisch aus location.host abgeleitet.
    urlInput.value = `ws://${location.host}/ws`;

    function setConnected(connected) {
      connectButton.textContent = connected ? "Disconnect" : "Connect";
      commandButtons.forEach((button) => {
        button.disabled = !connected;
      });
      textInput.disabled = !connected;
      sendTextButton.disabled = !connected;
    }

    function setStatus(text) {
      statusOutput.textContent = text;
    }

    connectButton.addEventListener("click", () => {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.close();
        return;
      }

      socket = new WebSocket(urlInput.value);
      setStatus("connecting");

      socket.addEventListener("open", () => {
        setStatus("connected");
        setConnected(true);
      });

      socket.addEventListener("message", (event) => {
        responseOutput.textContent = event.data;
      });

      socket.addEventListener("close", () => {
        setStatus("disconnected");
        setConnected(false);
      });

      socket.addEventListener("error", () => {
        setStatus("error");
        setConnected(false);
      });
    });

    commandButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const payload = JSON.parse(button.dataset.payload);
        const json = JSON.stringify(payload);

        sentOutput.textContent = json;
        socket.send(json);
      });
    });

    sendTextButton.addEventListener("click", () => {
      const text = textInput.value;

      if (text.length === 0) {
        return;
      }

      const json = JSON.stringify({ type: "text", text });

      sentOutput.textContent = json;
      socket.send(json);
      textInput.value = "";
    });
  </script>
</body>
</html>
