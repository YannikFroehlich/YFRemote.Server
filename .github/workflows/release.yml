name: Release YFRemote

on:
  push:
    tags:
      - "v*.*.*"
  workflow_call:
    inputs:
      version:
        description: "Zu veroeffentlichende Version ohne fuehrendes v, z. B. 1.2.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      server_sha: ${{ steps.sources.outputs.server_sha }}
    concurrency:
      # Aufgerufene Runs werden bereits vom Auto-Tag-Workflow serialisiert. Eine
      # eigene Gruppe vermeidet dort eine Selbstblockade; direkte Tag-Runs nutzen
      # dieselbe globale Sperre wie die Versionsermittlung.
      group: ${{ inputs.version != '' && format('yfremote-release-called-{0}', github.run_id) || 'yfremote-version-release' }}
      cancel-in-progress: false
      queue: max

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Quellstand verifizieren
        id: sources
        shell: pwsh
        run: |
          $serverSha = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $expectedServerSha = "${{ github.sha }}".Trim().ToLowerInvariant()

          if ($serverSha -notmatch '^[0-9a-f]{40}$') {
            throw "Ungueltige Commit-SHA: $serverSha"
          }
          if ($serverSha -ne $expectedServerSha) {
            throw "Checkout $serverSha entspricht nicht $expectedServerSha"
          }

          "server_sha=$serverSha" >> $env:GITHUB_OUTPUT

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: .NET einrichten
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Version ermitteln
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Ungueltige Release-Version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Client testen und bauen
        shell: pwsh
        working-directory: client
        run: |
          npm ci
          npm test -- --watch=false
          npm run build

      - name: Server testen
        shell: pwsh
        run: >-
          dotnet test tests/YFRemote.Server.Tests/YFRemote.Server.Tests.csproj
          --configuration Release

      - name: Client in Server integrieren
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path wwwroot -Force | Out-Null
          Copy-Item -Path client/dist/YFRemote.Client/browser/* -Destination wwwroot -Recurse -Force

      - name: Client-Build fuer den Linux-Release-Job bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: wwwroot
          path: wwwroot
          retention-days: 1

      - name: Server veroeffentlichen
        shell: pwsh
        run: >-
          dotnet publish YFRemote.Server.csproj
          --configuration Release
          --framework net10.0-windows
          --runtime win-x64
          --self-contained true
          --output publish
          -p:Version=${{ steps.version.outputs.version }}

      - name: Release-Manifest erstellen
        shell: pwsh
        run: |
          $manifest = [ordered]@{
            schemaVersion = 2
            version = "${{ steps.version.outputs.version }}"
            server = [ordered]@{
              repository = "${{ github.repository }}"
              sha = "${{ steps.sources.outputs.server_sha }}"
            }
          } | ConvertTo-Json -Depth 3

          $utf8WithoutBom = [System.Text.UTF8Encoding]::new($false)
          $manifestPath = Join-Path $PWD "publish/release-manifest.json"
          [System.IO.File]::WriteAllText(
            $manifestPath,
            $manifest + [Environment]::NewLine,
            $utf8WithoutBom)

      - name: Velopack installieren
        shell: pwsh
        run: dotnet tool install --global vpk --version 1.2.0

      - name: Vorherigen Release fuer Delta-Update laden
        continue-on-error: true
        shell: pwsh
        run: >-
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --token "${{ secrets.GITHUB_TOKEN }}"

      - name: Installer und Updatepakete erstellen
        shell: pwsh
        run: >-
          vpk pack
          --packId YFRemote
          --packVersion ${{ steps.version.outputs.version }}
          --packDir publish
          --mainExe YFRemote.Server.exe
          --packTitle YFRemote
          --packAuthors YannikFroehlich
          --icon client/public/favicon.ico
          --msi
          --instLocation Either
          --shortcuts StartMenuRoot

      - name: GitHub Release veroeffentlichen
        shell: pwsh
        run: >-
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token "${{ secrets.GITHUB_TOKEN }}"
          --publish
          --releaseName "YFRemote v${{ steps.version.outputs.version }}"
          --tag "v${{ steps.version.outputs.version }}"
          --targetCommitish "${{ steps.sources.outputs.server_sha }}"

      - name: Release-Manifest hochladen
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "v${{ steps.version.outputs.version }}"
          "publish/release-manifest.json"
          --repo "${{ github.repository }}"

      # vpk setzt keinen Release-Text. Beim automatischen Release stehen die Aenderungen noch
      # unter [Unreleased] (umbenannt wird erst danach), bei einem Tag-Push evtl. schon unter
      # der Version - daher erst die Version, dann [Unreleased] versuchen.
      - name: Release-Notes aus CHANGELOG setzen
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $changelog = (Get-Content CHANGELOG.md -Raw) -replace "`r`n", "`n"
          $notes = $null

          foreach ($heading in @([regex]::Escape($version), 'Unreleased')) {
            $match = [regex]::Match($changelog, "(?ms)^## \[$heading\][^\n]*\n(.*?)(?=^## \[|\z)")
            if ($match.Success -and $match.Groups[1].Value.Trim()) {
              # GitHub rendert jeden Zeilenumbruch im Release-Text als <br>; den 100-Zeichen-
              # Umbruch des CHANGELOG daher zu einer Zeile pro Eintrag zusammenziehen.
              $notes = $match.Groups[1].Value.Trim() -replace '(?<=\S)\n[ ]*(?=[^\s\-#])', ' '
              break
            }
          }

          if (-not $notes) {
            $notes = "Siehe [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/v$version/CHANGELOG.md)."
          }

          Set-Content -Path release-notes.md -Value $notes -Encoding utf8NoBOM
          gh release edit "v$version" --repo "${{ github.repository }}" --notes-file release-notes.md

  # Ergaenzt den bestehenden Windows-Release additiv um Linux-Pakete im selben Tag: Velopack
  # fuehrt pro Architektur einen eigenen Kanal mit eigener Feed-Datei (releases.win.json bleibt
  # unberuehrt), sodass ein installiertes Windows-YFRemote von den Linux-Paketen nichts sieht.
  # Jede Architektur baut nativ auf ihrem eigenen Runner statt arm64 auf einem x64-Runner zu
  # cross-packen (unklar, ob vpk das unterstuetzt) - ubuntu-24.04-arm ist fuer oeffentliche
  # Repos kostenlos.
  #
  # UNVERIFIZIERT: Dieser Job wurde noch nie real ausgefuehrt (kein Release seit seiner
  # Einfuehrung). Vor dem ersten echten Release pruefen: vpk-Kanaltrennung, ob "vpk upload
  # --publish" Pakete sauber in einen von einem anderen Job bereits veroeffentlichten Tag
  # nachtraegt statt ihn zu duplizieren, und ob der ubuntu-24.04-arm-Runner wie erwartet
  # verfuegbar ist.
  release-linux:
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Kanal traegt "-beta": der uinput-Eingabepfad ist nie gegen echte Hardware
          # gelaufen (siehe AGENTS.md "Linux support"). Eigener Kanalname statt eines
          # nachtraeglichen Labels, damit ein spaeterer Wechsel auf "linux-x64"/"linux-arm64"
          # (stabil) ein sauberer Kanalwechsel ist, keine rueckwirkende Umbenennung.
          - rid: linux-x64
            channel: linux-x64-beta
            os: ubuntu-latest
          - rid: linux-arm64
            channel: linux-arm64-beta
            os: ubuntu-24.04-arm

    runs-on: ${{ matrix.os }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: .NET einrichten
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Client-Build vom Windows-Job laden
        uses: actions/download-artifact@v5
        with:
          name: wwwroot
          path: wwwroot

      - name: Server testen
        run: >-
          dotnet test tests/YFRemote.Server.Tests/YFRemote.Server.Tests.csproj
          --configuration Release
          --framework net10.0

      - name: Server veroeffentlichen
        run: >-
          dotnet publish YFRemote.Server.csproj
          --configuration Release
          --framework net10.0
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output publish
          -p:Version=${{ needs.release.outputs.version }}

      - name: Velopack installieren
        run: dotnet tool install --global vpk --version 1.2.0

      - name: Vorherigen Release fuer Delta-Update laden
        continue-on-error: true
        run: >-
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --token "${{ secrets.GITHUB_TOKEN }}"
          --channel ${{ matrix.channel }}

      - name: Installer- und Updatepakete erstellen
        run: >-
          vpk pack
          --packId YFRemote
          --packVersion ${{ needs.release.outputs.version }}
          --packDir publish
          --mainExe YFRemote.Server
          --packTitle "YFRemote (Linux Beta)"
          --packAuthors YannikFroehlich
          --channel ${{ matrix.channel }}

      - name: GitHub Release Pakete hochladen
        # --merge noetig: ohne das lehnt vpk das Hochladen ab, wenn unter diesem Tag bereits
        # ein (vom Windows-Job veroeffentlichtes) Release existiert ("There is already an
        # existing release tagged '...'. Please delete this release or provide a new version
        # number."), gefunden beim ersten echten Release-Versuch dieses Jobs.
        run: >-
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token "${{ secrets.GITHUB_TOKEN }}"
          --publish
          --merge
          --releaseName "YFRemote v${{ needs.release.outputs.version }}"
          --tag "v${{ needs.release.outputs.version }}"
          --channel ${{ matrix.channel }}
          --targetCommitish "${{ needs.release.outputs.server_sha }}"

      # Nur einmal pro Release ausfuehren, nicht einmal je Matrix-Bein - haengt an, statt die
      # vom Windows-Job (oder vpk) gesetzten Release-Notes zu ueberschreiben.
      - name: Beta-Hinweis in die Release-Notes einfuegen
        if: matrix.rid == 'linux-x64'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ needs.release.outputs.version }}"
          current_body=$(gh release view "$tag" --repo "${{ github.repository }}" --json body -q .body)
          if [[ "$current_body" != *"Linux (Beta)"* ]]; then
            note=$'\n\n---\n**Linux (Beta):** uinput-Eingabepfad auf x86_64 verifiziert; arm64 und das installierte Paket sind noch ungetestet. Probleme bitte als Issue melden.'
            gh release edit "$tag" --repo "${{ github.repository }}" --notes "${current_body}${note}"
          fi

  # Ergaenzt den Release additiv um eine signierte Android-APK (siehe android/PLAN.md, Stufe 5),
  # analog zu release-linux fuer die Linux-Pakete. Laeuft nur, wenn die vier Signing-Secrets
  # gesetzt sind - vor dem allerersten Android-Release einmalig einen Keystore erzeugen
  # (`keytool -genkeypair -v -keystore yfremote-release.keystore -keyalg RSA -keysize 2048
  # -validity 10000 -alias yfremote`), base64-kodieren und als ANDROID_KEYSTORE_BASE64/
  # ANDROID_KEYSTORE_PASSWORD/ANDROID_KEY_ALIAS/ANDROID_KEY_PASSWORD in den Repository-Secrets
  # hinterlegen - ohne sie wird dieser Job uebersprungen statt den gesamten Release fehlschlagen
  # zu lassen.
  #
  # UNVERIFIZIERT: bislang ein einziger echter Lauf (v2.18.0, 2026-09-22) - der ist am
  # Android-SDK-Setup gescheitert (siehe Kommentar dort), der Rest des Jobs (Keystore, Gradle-
  # Build, Release-Upload) also noch nicht real durchlaufen. Windows/Linux-Assets desselben
  # Release-Laufs blieben davon unberuehrt, da release-android ein eigenstaendiger Job ist.
  release-android:
    needs: release
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Pruefen, ob Android-Signing konfiguriert ist
        id: signing
        shell: bash
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android-Signing-Secrets fehlen (siehe android/PLAN.md, Stufe 5) - ueberspringe Android-Build."
          fi

      - name: Client-Build vom Windows-Job laden
        if: steps.signing.outputs.configured == 'true'
        uses: actions/download-artifact@v5
        with:
          name: wwwroot
          path: android/app/src/main/assets/www

      - name: JDK einrichten
        if: steps.signing.outputs.configured == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Nicht android-actions/setup-android@v3: die Action bricht auf aktuellen Ubuntu-Runnern
      # beim sdkmanager-Aufruf mit exit code 1 ab (neue "Android SDK Preview"-Lizenz, die die
      # Action nicht automatisch akzeptiert - beobachtet 2026-09-22). Direktes Setup von Googles
      # eigenen Command-Line-Tools stattdessen, inkl. expliziter Lizenz-Akzeptanz.
      # "(yes || true) | sdkmanager" statt "yes | sdkmanager": sdkmanager schliesst stdin, sobald
      # alle Lizenzen abgefragt sind, wodurch "yes" mit SIGPIPE (exit 141) endet - mit "pipefail"
      # (Standard fuer bash-Steps) reisst das den ganzen Schritt trotz Erfolg von sdkmanager mit
      # in den Fehlschlag (beobachtet 2026-09-22, Run 35779526923).
      - name: Android-SDK einrichten
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -e
          sdk_root="$HOME/android-sdk"
          mkdir -p "$sdk_root/cmdline-tools"
          curl -fsSL -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
          unzip -q cmdline-tools.zip -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          rm cmdline-tools.zip

          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"

          (yes || true) | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle einrichten
        if: steps.signing.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Keystore aus Secret wiederherstellen
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/yfremote-release.keystore"

      - name: APK bauen und signieren
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        env:
          YFREMOTE_KEYSTORE_PATH: ${{ runner.temp }}/yfremote-release.keystore
          YFREMOTE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          YFREMOTE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          YFREMOTE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version_code=$(echo "${{ needs.release.outputs.version }}" | awk -F. '{print ($1 * 10000) + ($2 * 100) + $3}')
          gradle -p android assembleRelease \
            -PappVersionName=${{ needs.release.outputs.version }} \
            -PappVersionCode=$version_code

      - name: APK an GitHub Release anhaengen
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          gh release upload "v${{ needs.release.outputs.version }}" \
            "$apk#YFRemote-Android-v${{ needs.release.outputs.version }}.apk" \
            --repo "${{ github.repository }}"
