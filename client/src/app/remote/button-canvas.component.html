<div
  class="layout-canvas"
  [class.layout-canvas--editing]="editMode()"
  [style.--cols]="columns"
  [style.--row-h.px]="rowHeight"
  [style.--gap.px]="gap"
  [style.--rows]="layout.visibleRows()"
  role="group"
  [attr.aria-label]="i18n.t('buttonCanvas.ariaLabel')"
  #canvas
>
  @if (editMode() && layout.snapToGrid()) {
    <div class="layout-grid" aria-hidden="true"></div>
  }

  @for (item of renderItems(); track item.placement.id) {
    <div
      class="layout-slot"
      [class.layout-slot--dragging]="draggingId() === item.placement.id"
      [style.--col]="item.placement.col"
      [style.--row]="item.placement.row"
      [style.--w]="item.placement.colSpan"
      [style.--h]="item.placement.rowSpan"
      [attr.data-button-id]="item.placement.id"
      (pointerdown)="slotPointerDown($event, item)"
      (pointermove)="slotPointerMove($event)"
      (pointerup)="slotPointerUp($event, item)"
      (pointercancel)="slotPointerCancel($event)"
      (lostpointercapture)="slotPointerCancel($event)"
    >
      <button
        class="control-button"
        type="button"
        [disabled]="!editMode() && item.button.disabled === true"
        [attr.aria-disabled]="item.button.disabled === true || null"
        [attr.aria-label]="i18n.t(item.button.ariaLabel)"
        [attr.title]="item.button.unavailableText ?? i18n.t(item.button.ariaLabel)"
        [style.background]="item.placement.color ?? null"
        [style.border-color]="item.placement.color ?? null"
        [style.color]="item.placement.color ? textColorFor(item.placement.color) : null"
        (click)="activate(item)"
        (keydown)="slotKeydown($event, item)"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path [attr.d]="iconPaths[item.button.icon]"></path>
        </svg>
        @if (labelVisible(item.button)) {
          <span>{{ i18n.t(item.button.label) }}</span>
        }
      </button>

      @if (editMode()) {
        <button
          class="slot-remove"
          type="button"
          [attr.aria-label]="
            i18n.t('buttonCanvas.removeAriaLabel', { label: i18n.t(item.button.label) })
          "
          (click)="remove(item)"
          (pointerdown)="$event.stopPropagation()"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
            <path
              d="M6 6L18 18M18 6L6 18"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
            />
          </svg>
        </button>
      }
    </div>
  }
</div>

<dialog
  #timerDialog
  class="timer-dialog"
  [attr.aria-label]="i18n.t('timer.title')"
  (close)="timerDraft.set(null)"
>
  @if (timerDraft(); as draft) {
    <form
      class="timer-dialog__form"
      (submit)="startTimer($event, timerMinutes.value, timerPower.value)"
    >
      <h2>{{ i18n.t('timer.title') }}</h2>
      <label class="field">
        <span>{{ i18n.t('timer.minutes') }}</span>
        <input
          #timerMinutes
          type="number"
          inputmode="numeric"
          min="0"
          max="1440"
          [value]="draft.minutes"
        />
      </label>
      <label class="field">
        <span>{{ i18n.t('timer.power') }}</span>
        <select #timerPower>
          @for (power of timerPowers; track power) {
            <option [value]="power" [selected]="power === draft.power">
              {{ i18n.t('timer.power.' + power) }}
            </option>
          }
        </select>
      </label>
      <div class="settings-actions">
        <button class="secondary-button" type="button" (click)="closeTimer()">
          {{ i18n.t('common.cancel') }}
        </button>
        <button class="primary-button" type="submit">{{ i18n.t('timer.start') }}</button>
      </div>
    </form>
  }
</dialog>
