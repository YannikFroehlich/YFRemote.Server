name: CI

# Baut und testet Server und Client bei jedem Pull Request, unabhaengig vom
# Release-Workflow (der nur bei Push/Tag auf main laeuft). Verhindert, dass ein
# kaputter Build oder fehlschlagende Tests erst beim Release-Versuch auffallen.
#
# Beide Jobs laufen immer, ohne paths-Filter: die Laufzeit ist gering und ein
# Filter wuerde nur verdecken, dass der Server den gebauten Client ausliefert.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Auschecken
        uses: actions/checkout@v6

      - name: .NET einrichten
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Abhaengigkeiten wiederherstellen
        shell: pwsh
        run: dotnet restore

      - name: Server bauen
        shell: pwsh
        run: dotnet build --configuration Release --no-restore

      - name: Server testen
        shell: pwsh
        run: >-
          dotnet test tests/YFRemote.Server.Tests/YFRemote.Server.Tests.csproj
          --configuration Release

  client:
    runs-on: ubuntu-latest

    steps:
      - name: Auschecken
        uses: actions/checkout@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Abhaengigkeiten installieren
        working-directory: client
        run: npm ci

      - name: Client testen
        working-directory: client
        run: npm test -- --watch=false

      - name: Client bauen
        working-directory: client
        run: npm run build

  # Absichtlich nicht "build-and-test" genannt - das ist der Pflicht-Check auf main
  # (siehe AGENTS.md "Release automation"). Eine Umbenennung dieses Jobs waere folgenlos,
  # eine Umbenennung von build-and-test wuerde jeden Merge nach main blockieren.
  linux:
    runs-on: ubuntu-latest

    steps:
      - name: Auschecken
        uses: actions/checkout@v6

      - name: .NET einrichten
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Abhaengigkeiten wiederherstellen
        run: dotnet restore

      - name: Server bauen (net10.0)
        run: dotnet build --configuration Release --framework net10.0 --no-restore

      - name: Server testen (net10.0)
        run: >-
          dotnet test tests/YFRemote.Server.Tests/YFRemote.Server.Tests.csproj
          --configuration Release
          --framework net10.0
