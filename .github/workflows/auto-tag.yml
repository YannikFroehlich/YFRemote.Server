name: Auto Tag YFRemote

# Ermittelt bei jedem Push nach main die naechste semantische Version anhand von
# Conventional Commits (fix: -> patch, feat: -> minor, feat!:/BREAKING CHANGE: -> major)
# und stoesst darueber direkt den bestehenden Release-Workflow an. Ein Commit mit
# "[skip release]" in der Merge-Commit-Message ueberspringt das Release. Ueber
# workflow_dispatch laesst sich die Versionsstufe auch manuell erzwingen, z. B. um
# nach einer reinen Client-Aenderung ein neues Release ohne neuen Server-Commit
# auszuloesen.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Versionsstufe erzwingen (z. B. fuer eine reine Client-Aenderung)"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  determine-version:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip release]')
    outputs:
      version: ${{ steps.next.outputs.new_version }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Naechste Version aus Commits ermitteln
        id: next
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
          release_branches: main
          tag_prefix: v
          dry_run: true

  release:
    needs: determine-version
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.determine-version.outputs.version }}
    secrets: inherit
