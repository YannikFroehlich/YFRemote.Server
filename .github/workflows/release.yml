name: Release YFRemote

on:
  push:
    tags:
      - "v*.*.*"
  workflow_call:
    inputs:
      version:
        description: "Zu veroeffentlichende Version ohne fuehrendes v, z. B. 1.2.3"
        required: true
        type: string
      client_sha:
        description: "Unveraenderliche Commit-SHA aus YFRemote.Client"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    concurrency:
      # Aufgerufene Runs werden bereits vom Auto-Tag-Workflow serialisiert. Eine
      # eigene Gruppe vermeidet dort eine Selbstblockade; direkte Tag-Runs nutzen
      # dieselbe globale Sperre wie die Versionsermittlung.
      group: ${{ inputs.client_sha != '' && format('yfremote-release-called-{0}', github.run_id) || 'yfremote-version-release' }}
      cancel-in-progress: false
      queue: max

    steps:
      - name: Server auschecken
        uses: actions/checkout@v6
        with:
          path: server
          ref: ${{ github.sha }}

      - name: Client auschecken
        uses: actions/checkout@v6
        with:
          repository: YannikFroehlich/YFRemote.Client
          path: client
          ref: ${{ inputs.client_sha || 'master' }}
          token: ${{ secrets.CLIENT_REPOSITORY_TOKEN || github.token }}

      - name: Quellstaende verifizieren
        id: sources
        shell: pwsh
        run: |
          $serverSha = (git -C server rev-parse HEAD).Trim().ToLowerInvariant()
          $clientSha = (git -C client rev-parse HEAD).Trim().ToLowerInvariant()
          $expectedServerSha = "${{ github.sha }}".Trim().ToLowerInvariant()
          $expectedClientSha = "${{ inputs.client_sha }}".Trim().ToLowerInvariant()

          if ($serverSha -notmatch '^[0-9a-f]{40}$') {
            throw "Ungueltige Server-SHA: $serverSha"
          }
          if ($clientSha -notmatch '^[0-9a-f]{40}$') {
            throw "Ungueltige Client-SHA: $clientSha"
          }
          if ($serverSha -ne $expectedServerSha) {
            throw "Server-Checkout $serverSha entspricht nicht $expectedServerSha"
          }
          if (![string]::IsNullOrWhiteSpace($expectedClientSha) -and $clientSha -ne $expectedClientSha) {
            throw "Client-Checkout $clientSha entspricht nicht $expectedClientSha"
          }

          "server_sha=$serverSha" >> $env:GITHUB_OUTPUT
          "client_sha=$clientSha" >> $env:GITHUB_OUTPUT

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: .NET einrichten
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Version ermitteln
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Ungueltige Release-Version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Client testen und bauen
        shell: pwsh
        working-directory: client
        run: |
          npm ci
          npm test -- --watch=false
          npm run build

      - name: Server testen
        shell: pwsh
        run: >-
          dotnet test server/tests/YFRemote.Server.Tests/YFRemote.Server.Tests.csproj
          --configuration Release

      - name: Client in Server integrieren
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path server/wwwroot -Force | Out-Null
          Copy-Item -Path client/dist/YFRemote.Client/browser/* -Destination server/wwwroot -Recurse -Force

      - name: Server veroeffentlichen
        shell: pwsh
        run: >-
          dotnet publish server/YFRemote.Server.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish
          -p:Version=${{ steps.version.outputs.version }}

      - name: Release-Manifest erstellen
        shell: pwsh
        run: |
          $manifest = [ordered]@{
            schemaVersion = 1
            version = "${{ steps.version.outputs.version }}"
            server = [ordered]@{
              repository = "${{ github.repository }}"
              sha = "${{ steps.sources.outputs.server_sha }}"
            }
            client = [ordered]@{
              repository = "YannikFroehlich/YFRemote.Client"
              sha = "${{ steps.sources.outputs.client_sha }}"
            }
          } | ConvertTo-Json -Depth 3

          $utf8WithoutBom = [System.Text.UTF8Encoding]::new($false)
          $manifestPath = Join-Path $PWD "publish/release-manifest.json"
          [System.IO.File]::WriteAllText(
            $manifestPath,
            $manifest + [Environment]::NewLine,
            $utf8WithoutBom)

      - name: Velopack installieren
        shell: pwsh
        run: dotnet tool install --global vpk --version 1.2.0

      - name: Vorherigen Release fuer Delta-Update laden
        continue-on-error: true
        shell: pwsh
        run: >-
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --token "${{ secrets.GITHUB_TOKEN }}"

      - name: Installer und Updatepakete erstellen
        shell: pwsh
        run: >-
          vpk pack
          --packId YFRemote
          --packVersion ${{ steps.version.outputs.version }}
          --packDir publish
          --mainExe YFRemote.Server.exe
          --packTitle YFRemote
          --packAuthors YannikFroehlich
          --icon client/public/favicon.ico
          --msi
          --instLocation Either
          --shortcuts StartMenuRoot

      - name: GitHub Release veroeffentlichen
        shell: pwsh
        run: >-
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token "${{ secrets.GITHUB_TOKEN }}"
          --publish
          --releaseName "YFRemote v${{ steps.version.outputs.version }}"
          --tag "v${{ steps.version.outputs.version }}"
          --targetCommitish "${{ steps.sources.outputs.server_sha }}"

      - name: Release-Manifest hochladen
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "v${{ steps.version.outputs.version }}"
          "publish/release-manifest.json"
          --repo "${{ github.repository }}"
