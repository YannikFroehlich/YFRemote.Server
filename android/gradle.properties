org.gradle.jvmargs=-Xmx2048m
# Stufe 4 braucht androidx.core.content.FileProvider fuer Zwischenablage-Bilder
# (content://-URI statt Roh-Bytestream) - dafuer reicht ein einzelnes androidx.core-Artefakt,
# kein Compose/AppCompat/sonstiges AndroidX.
android.useAndroidX=true

# Kotlin 1.9.24 kann die Java-Version des Android-Studio-JBR (25) nicht parsen und laesst dabei
# die inkrementellen Caches fallen ("IllegalArgumentException: 25.0.3"); ohne sie baut es sauber.
kotlin.incremental=false
